# Publica firestore.rules e firestore.indexes.json quando eles mudam em
# `main`. Separado do deploy do site porque tem outro efeito colateral
# (afeta permissões de dados imediatamente) e vale ficar visível como
# etapa própria no histórico do Actions.
name: Publicar regras do Firestore

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install -g firebase-tools
      # google-github-actions/auth grava o JSON do secret num arquivo e
      # exporta GOOGLE_APPLICATION_CREDENTIALS apontando para ele — é o
      # formato que o firebase-tools espera (não aceita o JSON inline).
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPRA_PLANEJADA }}
      - run: firebase deploy --only firestore:rules,firestore:indexes --project compra-planejada --non-interactive
